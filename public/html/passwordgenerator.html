<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#343a37">
		<title>Password Generator | GEM/MIM Portal</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
		<script src="../js/theme.js"></script>
		<link rel="stylesheet" href="../css/styles.css">
		<script src="../js/passwordgenerator.js" defer></script>
	</head>
	<body>
		<main class="password-generator-page">
			<h1 class="password-generator-title">Password Generator</h1>
			<section class="password-generator-controls" aria-label="Password settings">
				<div class="password-length-heading">
					<label for="password-length">Password length</label>
					<output id="password-length-output" for="password-length">6</output>
				</div>
				<input class="password-length-slider" id="password-length" type="range" min="6" max="32" value="6">
				<fieldset class="password-character-options">
					<legend>Include character types</legend>
					<label><input id="include-uppercase" type="checkbox"> Uppercase letters</label>
					<label><input id="include-lowercase" type="checkbox"> Lowercase letters</label>
					<label><input id="include-numbers" type="checkbox"> Numbers</label>
					<label><input id="include-symbols" type="checkbox"> Symbols</label>
				</fieldset>
				<button class="password-generate-button" id="generate-passwords" type="button">Generate</button>
				<p class="password-generator-status" id="password-generator-status" aria-live="polite"></p>
			</section>
			<ol class="password-results" id="password-results" aria-label="Generated passwords"></ol>
		</main>
	</body>
</html>
